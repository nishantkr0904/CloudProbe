---
# CloudProbe — logging configuration
#
# Python ``logging.dictConfig`` structure.  Consumed by the util/logging
# module (Phase 3+).  Kept here so operators can adjust verbosity without
# a code change.

version: 1
disable_existing_loggers: false

formatters:
  json:
    format: '{"time":"%(asctime)s","level":"%(levelname)s","logger":"%(name)s","msg":%(message)s}'
  console:
    format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"

handlers:
  stderr:
    class: logging.StreamHandler
    stream: ext://sys.stderr
    formatter: console
    level: INFO
  file:
    class: logging.handlers.RotatingFileHandler
    filename: logs/cloudprobe.log
    maxBytes: 10485760      # 10 MiB
    backupCount: 5
    formatter: json
    level: DEBUG

loggers:
  cloudprobe:
    level: INFO
    handlers: [stderr, file]
    propagate: false

root:
  level: WARNING
  handlers: [stderr]
