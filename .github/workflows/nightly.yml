---
# CloudProbe — nightly heavy suite (ROADMAP Phase 8, architecture.md §11.3)
#
# Contract: regression + failure_scenarios on schedule. "Nightly failures
# open a GitHub Issue so overnight breakage is visible the next morning"
# (architecture.md:694). The failure_scenarios tier doesn't exist yet
# (ROADMAP Phase 7), so `make test-failure` exits 5 (no tests collected),
# which Makefile:34 PYTEST_OK_EMPTY maps to success — the workflow stays
# green until the tier lands.

name: Nightly

"on":
  schedule:
    # 02:00 UTC daily
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  nightly:
    name: regression + failure scenarios
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Bootstrap environment
        run: make bootstrap

      - name: Regression tests
        run: make test-regression

      - name: Failure-scenario tests
        run: make test-failure

      # Open an issue on failure so the next morning surfaces the breakage.
      # Only fires when the workflow fails; manual workflow_dispatch runs
      # that fail do not open issues (the `github.event_name` guard).
      - name: Open issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nightly build failed on ${new Date().toISOString().split('T')[0]}`,
              body: [
                'The nightly regression + failure-scenario suite failed.',
                '',
                `Workflow run: ${context.payload.repository.html_url}/actions/runs/${context.runId}`
              ].join('\n'),
              labels: ['ci', 'nightly-failure']
            });
